<rect x="940" y="40" width="500" height="560" rx="22" fill="#ffffff" stroke="#B4BABD" stroke-width="2"/>
<text x="970.0" y="86.0" font-size="22" font-weight="700" fill="#3a4a4a" text-anchor="start" >How BigBacter reads the tree</text>
<path d="M970,128 H984 V172 H970" fill="none" stroke="#0E8C7F" stroke-width="4" stroke-linecap="round"/>
<text x="1010.0" y="144.0" font-size="23" font-weight="700" fill="#1f2426" text-anchor="start" >Strong link</text>
<text x="1410.0" y="144.0" font-size="23" font-weight="700" fill="#0E8C7F" text-anchor="end" >≤ 10 SNPs</text>
<text x="1010.0" y="172.0" font-size="18" font-weight="400" fill="#5d6b6b" text-anchor="start" >A–B: 6 SNPs</text>
<text x="1010.0" y="198.0" font-size="15" font-weight="400" fill="#8A9296" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">--strong_link_threshold</text>
<path d="M970,268 H984 V312 H970" fill="none" stroke="#B5802A" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>
