<text x="1010.0" y="478.0" font-size="15" font-weight="400" fill="#8A9296" text-anchor="start" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">--partition_distance</text>
<text x="970.0" y="574.0" font-size="16" font-weight="700" fill="#5d6b6b" text-anchor="start" >Defaults, not outbreak definitions:</text>
