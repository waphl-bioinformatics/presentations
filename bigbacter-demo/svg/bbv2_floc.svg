<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 438" width="1200" height="438" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>BigBacter: clustering with FLOC, then core SNP analysis; no database build needed</title>
<text x="40" y="54" font-size="34" font-weight="700" fill="#3C3F5C">BigBacter v2.0</text>
<rect x="20" y="80" width="1160" height="334" rx="22" fill="#F2F4F5"/>

<!-- Main flow -->
<rect x="60" y="118" width="260" height="110" rx="12" fill="#3C3F5C"/>
<text x="190" y="181" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Input Sequences</text>

<line x1="320" y1="173" x2="392" y2="173" stroke="#8A9296" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="412,173 392,183 392,163" fill="#8A9296"/>

<rect x="420" y="118" width="320" height="110" rx="12" fill="#F2C98A"/>
<text x="580" y="158" font-size="18" fill="#4a3f2a" text-anchor="middle">Clustering</text>
<text x="580" y="198" font-size="32" font-weight="800" fill="#3C3F5C" text-anchor="middle" letter-spacing="0.5">floc</text>

<line x1="740" y1="173" x2="812" y2="173" stroke="#8A9296" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="832,173 812,183 812,163" fill="#8A9296"/>

<rect x="840" y="118" width="300" height="110" rx="12" fill="#E07A5F"/>
<text x="990" y="168" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Core SNP analysis</text>
<text x="990" y="196" font-size="17" fill="#FFF1EC" text-anchor="middle">per cluster</text>

<!-- Side task, no longer needed (crossed out) -->
<g opacity="0.45">
<line x1="580" y1="286" x2="580" y2="252" stroke="#8A9296" stroke-width="3.4" stroke-linecap="round"/>
<polygon points="580,232 570,252 590,252" fill="#8A9296"/>
<rect x="430" y="290" width="300" height="96" rx="12" fill="#6E767A"/>
<text x="580" y="331" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Select or build a</text>
<text x="580" y="357" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">PopPUNK database</text>
</g>
<line x1="440" y1="298" x2="720" y2="378" stroke="#E07A5F" stroke-width="7" stroke-linecap="round"/>
<line x1="720" y1="298" x2="440" y2="378" stroke="#E07A5F" stroke-width="7" stroke-linecap="round"/>
</svg>